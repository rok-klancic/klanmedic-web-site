<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klanmedic</title>
    <meta name="description" content="Klanmedic — spletna stran." />
    <link rel="stylesheet" href="./src/css/output.css" />
  </head>
  <body class="min-h-screen bg-white font-sans text-slate-900 antialiased">
    <header
      class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur"
      x-data="{ open: false }"
    >
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <a href="#" class="text-xl font-bold tracking-tight">Klanmedic</a>

        <button
          type="button"
          class="inline-flex items-center justify-center rounded-md p-2 text-slate-700 hover:bg-slate-100 md:hidden"
          @click="open = !open"
          :aria-expanded="open"
          aria-label="Toggle navigation"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>

        <ul class="hidden items-center gap-6 md:flex">
          <li><a href="#home" class="hover:text-blue-600">Domov</a></li>
          <li><a href="#services" class="hover:text-blue-600">Storitve</a></li>
          <li><a href="#contact" class="hover:text-blue-600">Kontakt</a></li>
        </ul>
      </nav>

      <ul
        class="space-y-2 border-t border-slate-200 px-4 pb-4 md:hidden"
        x-show="open"
        x-transition
        x-cloak
      >
        <li><a href="#home" class="block py-2">Domov</a></li>
        <li><a href="#services" class="block py-2">Storitve</a></li>
        <li><a href="#contact" class="block py-2">Kontakt</a></li>
      </ul>
    </header>

    <main>
      <section id="home" class="mx-auto max-w-6xl px-4 py-20 text-center">
        <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">
          Klanmedic
        </h1>
        <p class="mx-auto mt-4 max-w-2xl text-lg text-slate-600">
          Hitro, enostavno in zanesljivo. Začnite z ogledom naših storitev.
        </p>
        <a
          href="#services"
          class="mt-8 inline-block rounded-lg bg-blue-600 px-6 py-3 font-medium text-white shadow hover:bg-blue-700"
        >
          Preberi več
        </a>
      </section>

      <section
        id="services"
        class="mx-auto max-w-6xl px-4 py-16"
        x-data="counter"
      >
        <h2 class="text-2xl font-semibold">Demo Alpine komponente</h2>
        <p class="mt-2 text-slate-600">
          Klikni gumb — števec je vezan na Alpine.js.
        </p>

        <div class="mt-6 flex items-center gap-4">
          <button
            type="button"
            @click="count--"
            class="rounded-md border border-slate-300 px-4 py-2 hover:bg-slate-100"
          >
            −
          </button>
          <span class="min-w-[3ch] text-center text-2xl font-semibold" x-text="count"></span>
          <button
            type="button"
            @click="count++"
            class="rounded-md border border-slate-300 px-4 py-2 hover:bg-slate-100"
          >
            +
          </button>
        </div>
      </section>

      <section id="contact" class="mx-auto max-w-6xl px-4 py-16">
        <h2 class="text-2xl font-semibold">Kontakt</h2>
        <p class="mt-2 text-slate-600">Pišite nam na info@klanmedic.si.</p>
      </section>
    </main>

    <footer class="border-t border-slate-200 py-8">
      <div class="mx-auto max-w-6xl px-4 text-sm text-slate-500">
        © <span x-data x-text="new Date().getFullYear()"></span> Klanmedic
      </div>
    </footer>

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>

    <script src="./src/js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </body>
</html>
